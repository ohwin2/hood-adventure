<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>후드 모험가 — 멀티플레이</title>
<style>
  html,body{margin:0;height:100%;background:#1c1826;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#7aaee8}
  #pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;
    padding:16px 18px calc(16px + env(safe-area-inset-bottom));pointer-events:none}
  .grp{display:flex;gap:14px;pointer-events:auto;align-items:flex-end}
  .btn{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.16);
    border:2px solid rgba(255,255,255,.35);color:#fff;font-size:28px;display:flex;
    align-items:center;justify-content:center;touch-action:none}
  .btn.on{filter:brightness(1.6)}
  #atk{width:68px;height:68px;margin-bottom:34px;background:rgba(222,64,64,.28);border-color:rgba(255,120,120,.6);font-size:28px}
  #atk.none{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);opacity:.6}
  #jump{width:84px;height:84px;background:rgba(250,200,60,.28);border-color:rgba(250,200,60,.6);font-size:20px;font-weight:700}
  #infoBtn{position:fixed;top:max(10px, env(safe-area-inset-top));right:12px;z-index:5;padding:7px 12px;border-radius:18px;
    background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.35);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  body:not(.touch) #infoBtn{position:static;margin-top:10px}
  body.touch #infoBtn{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;font-size:20px;border-radius:50%}
  #info{position:fixed;inset:0;z-index:10;background:rgba(18,14,28,.78);display:none;align-items:center;justify-content:center;padding:16px}
  #info.show{display:flex}
  #info .card{background:#2a2438;border:2px solid #4a4060;border-radius:14px;padding:14px 12px;color:#eee;max-width:480px;width:100%;
    max-height:100%;overflow:auto;box-sizing:border-box}
  #info h3{margin:0 0 10px;color:#fac83c;font-size:18px}
  #info table{width:100%;border-collapse:collapse;font-size:13px}
  #info th small{font-size:10px;color:#b8b0cc;font-weight:500}
  #info th,#info td{padding:6px 2px;text-align:center;border-bottom:1px solid #3c3450}
  #info td:first-child,#info th:first-child{text-align:left}
  #info .up{color:#7cf0a0;font-weight:700}#info .dn{color:#ff8090;font-weight:700}#info .no{color:#9aa0b4;font-weight:700}
  #info p{font-size:12px;color:#b8b0cc;line-height:1.6;margin:10px 0 0}
  #info button{margin-top:12px;width:100%;padding:10px;border-radius:10px;border:0;background:#fac83c;color:#22182f;font-weight:700;font-size:15px}
  #lobby{position:fixed;inset:0;z-index:20;background:rgba(18,14,28,.92);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
  #lobby.hide{display:none}
  #lobby .card{background:#2a2438;border:2px solid #4a4060;border-radius:16px;padding:20px;color:#eee;width:100%;max-width:360px;box-sizing:border-box;text-align:center}
  #lobby h2{margin:0 0 4px;color:#fac83c;font-size:24px}
  #lobby p{margin:6px 0;color:#b8b0cc;font-size:13px;line-height:1.5}
  #lobby button{width:100%;padding:13px;margin-top:10px;border-radius:12px;border:0;font-size:16px;font-weight:700;background:#4a4060;color:#fff}
  #lobby button.pri{background:#fac83c;color:#22182f}
  #lobby button:disabled{opacity:.45}
  #lobby input{width:100%;box-sizing:border-box;padding:12px;margin-top:10px;border-radius:12px;border:2px solid #4a4060;background:#1c1826;color:#fff;
    font-size:22px;text-align:center;letter-spacing:6px;text-transform:uppercase;font-weight:700}
  #lobby .code{font-size:40px;font-weight:800;letter-spacing:8px;color:#fff;margin:8px 0}
  #lobby ul{list-style:none;padding:0;margin:10px 0;text-align:left}
  #lobby li{padding:8px 10px;background:#1c1826;border-radius:8px;margin:5px 0;font-size:14px;display:flex;align-items:center;gap:8px}
  #lobby li i{width:12px;height:12px;border-radius:3px;display:inline-block}
  #lobby .err{color:#ff8090}
  #hint{color:#a9a3bf;font-size:12px;margin-top:8px;text-align:center}
  body.touch #hint{display:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="320" height="176"></canvas>
<div id="hint">← → 이동 · Space / ↑ 점프 · ↓+점프 발판 내려가기 · X / J 공격 · I 상성표 · R 새 맵</div></div>
<div id="lobby"><div class="card" id="lobbyCard"></div></div>
<div id="infoBtn">📖 상성표</div>
<div id="info"><div class="card"><h3>무기 상성표</h3><table id="effTable"></table>
<p>▲ 효과 굉장 · 피해 2배 &nbsp; ▼ 효과 별로 · 피해 절반 &nbsp; ✕ 튕겨냄 · 피해 없음<br>게임 중에는 들고 있는 무기 기준으로 몬스터 머리 위에 ▲ ▼ ✕ 가 표시돼요.</p>
<button id="closeInfo">닫고 계속하기</button></div></div>
<div id="pad">
  <div class="grp"><div class="btn" id="left">◀</div><div class="btn" id="right">▶</div></div>
  <div class="grp"><div class="btn none" id="atk">✊</div><div class="btn" id="jump">JUMP</div></div>
</div>

function fit(){

  const availH=isTouch&&portrait?h-150:h-(isTouch?0:80);
  const nh=isTouch&&portrait?Math.max(176,Math.min(360,Math.round(VW*availH/w))):176;
  if(nh!==VH){VH=nh;cv.height=VH;ctx.imageSmoothingEnabled=false;}
  let s=Math.min(w/VW,availH/VH);if(s>=1&&!isTouch)s=Math.max(1,Math.floor(s*2)/2);
  cv.style.width=VW*s+'px';cv.style.height=VH*s+'px';
  const wr=document.getElementById('wrap');
  wr.style.justifyContent=isTouch&&portrait?'flex-start':'center';

}

function beep(f1,f2,dur,type='square',vol=.08){if(!ac)return;try{
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type;
  o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur);}catch(e){}}

const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const gSolid=(g,x,y)=>{const c=g[y]&&g[y][x];return c==='X'||c==='S'||c==='B';};
function isStand(g,x,y){if(x<1||x>LW-2||y<1||y>LH-2)return false;
  return !gSolid(g,x,y)&&!gSolid(g,x,y-1)&&(gSolid(g,x,y+1)||g[y+1][x]==='-');}
function genMap(){
  const g=[];for(let y=0;y<LH;y++)g.push(new Array(LW).fill('.'));
  for(let x=0;x<LW;x++){g[0][x]='S';g[LH-1][x]='S';g[LH-2][x]='X';}
  for(let y=0;y<LH;y++){g[y][0]='S';g[y][LW-1]='S';}
  // layered floors of floating bricks / wooden platforms, 3 tiles apart (jumpable)
  for(let base=LH-5;base>=4;base-=3){
    let x=1+rnd(0,4);
    while(x<LW-2){
      const len=rnd(3,8),r=Math.random(),ch=r<.25?'X':r<.45?'B':'-';
      for(let i=0;i<len&&x+i<LW-1;i++)g[base][x+i]=(ch==='X'&&Math.random()<.2)?'B':ch;
      x+=len+rnd(2,5);
    }
  }
  // small stone pillars on top of solid ground / bricks
  for(let i=0;i<16;i++){const x=rnd(2,LW-3),y=rnd(3,LH-3);
    if(g[y][x]==='.'&&g[y-1][x]==='.'&&gSolid(g,x,y+1)){const c=Math.random()<.5?'B':'S';g[y][x]=c;if(Math.random()<.4)g[y-1][x]=c;}}
  // brick walls on the ground floor that can be smashed through
  for(let i=0;i<4;i++){const x=rnd(10,LW-4);if(g[LH-3][x]==='.'&&g[LH-4][x]==='.'){g[LH-3][x]='B';g[LH-4][x]='B';}}
  for(let y=LH-5;y<LH-2;y++)for(let x=1;x<7;x++)g[y][x]='.';
  return g;
}
function reachable(g,sx,sy){
  const seen=new Set([sx+','+sy]),q=[[sx,sy]],out=[];
  const add=(x,y)=>{const k=x+','+y;if(!seen.has(k)&&isStand(g,x,y)){seen.add(k);q.push([x,y]);}};
  while(q.length){const [x,y]=q.shift();out.push([x,y]);

const ATK_T=.2,GRAV=760,MAXF=320,ACC=700,FRIC=900,MAXV=92,JUMPV=-290;

    if(NET.mode==='guest')for(const p of popups){p.life-=dt;p.y-=14*dt;}popups=popups.filter(p=>p.life>0);}
  if(state!=='lobby'&&me)updCamera(dt);
  if(grid)draw();
  requestAnimationFrame(loop);}

// ======================= NETWORK (PeerJS, host-authoritative) =======================
const NET={mode:'solo',myId:'me',peer:null,conns:{},host:null,code:'',sendAcc:0};
const ROOM_PREFIX='hoodadv-room-';
function peerOpts(){
  return {debug:0,config:{iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}],sdpSemantics:'unified-plan'}};}
// Microphone permission makes browsers reveal real LAN IPs (instead of hidden *.local names),
// which lets phones on the same Wi-Fi connect directly. Audio is muted and never recorded/sent.
const MIC={stream:null,ok:false,tried:false,timer:null};
async function micUnlock(holdMs){
  clearTimeout(MIC.timer);
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){MIC.tried=true;MIC.ok=false;return 'insecure';}
  try{
    if(!MIC.stream){MIC.stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});MIC.stream.getTracks().forEach(t=>t.enabled=false);}
    MIC.ok=true;MIC.tried=true;if(holdMs)MIC.timer=setTimeout(micRelease,holdMs);return 'ok';
  }catch(e){MIC.tried=true;MIC.ok=false;return 'denied';}
}
function micRelease(){clearTimeout(MIC.timer);if(MIC.stream){MIC.stream.getTracks().forEach(t=>t.stop());MIC.stream=null;}}
const MIC_MSG={insecure:'⚠ 이 방식으로 연 파일에서는 마이크 권한을 요청할 수 없어서 직접 연결이 안 될 수 있어요. https 주소(예: GitHub Pages)로 열어 주세요.',
  denied:'⚠ 마이크 권한이 거부되어 직접 연결이 안 될 수 있어요. 브라우저 주소창의 사이트 설정에서 마이크를 허용한 뒤 다시 시도해 주세요.'};
const EMBEDDED=(()=>{try{return window.top!==window;}catch(e){return true;}})();
let netTimer=null;
function netTimeout(ms,msg){clearTimeout(netTimer);netTimer=setTimeout(()=>{lobbyErr=msg;renderLobby();},ms);}
function watchIce(conn,label){
  const pc=conn.peerConnection;if(!pc)return;const kinds=new Set();
  let hidden=false,lan=false;
  pc.addEventListener('icecandidate',ev=>{if(ev.candidate&&ev.candidate.candidate){const c=ev.candidate.candidate,m=/ typ (\w+)/.exec(c);if(m)kinds.add(m[1]);
    if(/\.local /.test(c))hidden=true;else if(/ (10|192\.168|172\.(1[6-9]|2\d|3[01]))\.\d+\.\d+ \d+ typ host/.test(c))lan=true;}});
  pc.addEventListener('iceconnectionstatechange',()=>{const st=pc.iceConnectionState;
    if(st==='checking'){lobbyMsg=label+' 기기끼리 직접 연결을 시도하는 중…';renderLobby();}
    if(st==='connected'||st==='completed'){lobbyMsg=label+' 직접 연결 성공!';renderLobby();if(label.startsWith('③'))setTimeout(micRelease,3000);}
    if(st==='failed'||st==='disconnected'&&state==='lobby'){
      lobbyErr='기기끼리 직접 연결하지 못했어요. [진단: 내 내부주소 '+(lan?'공개됨':hidden?'숨겨짐':'없음')+']'+
        (lan?' 내부주소는 정상이에요. 상대 기기도 마이크 권한을 허용했는지 확인하고, 그래도 안 되면 공유기가 기기 간 통신을 막고 있을 수 있어요(AP 격리/게스트 와이파이). 휴대폰 핫스팟으로 모두 연결해 보세요.'
           :' 내부주소가 숨겨져 있어요. 마이크 권한을 허용해야 해요. https 주소로 열었는지도 확인해 주세요.');
      renderLobby();}});}
const COLS_FREE=()=>[0,1,2,3].filter(c=>!roster.some(r=>r.col===c));
// record effects on the host so guests can replay them
const SFX0={};for(const k in SFX){SFX0[k]=SFX[k];SFX[k]=()=>{SFX0[k]();if(NET.mode==='host')fxq.push(['s',k]);};}
const burst0=burst;burst=function(x,y,col,n=8,sp=60){burst0(x,y,col,n,sp);if(NET.mode==='host')fxq.push(['b',x|0,y|0,col,n,sp]);};
const popup0=popup;popup=function(t,x,y,col='#fff'){popup0(t,x,y,col);if(NET.mode==='host')fxq.push(['p',t,x|0,y|0,col]);};
let gridFull=true,lastGrid=null;
const R1=v=>Math.round(v*10)/10;
const EK=['kind','k','x','y','w','h','vx','vy','hp','maxhp','dead','flash','faded','ph','charge','wind','stun','cdir','aim','pose','face','open','ground','hasKey'];
const PK=['id','name','col','x','y','vx','vy','face','ground','hp','inv','anim','atk','swing','bowT','castT','weapon','lv','dead'];
const pick=(o,ks)=>{const r={};for(const k of ks){const v=o[k];if(v!==undefined&&v!==0&&v!==false&&v!==null)r[k]=typeof v==='number'?R1(v):v;}return r;};
function snapshot(){
  const s={t:'s',st:state,stg:stage,co:coins,hk:hasKey,tm:R1(timer),pt:R1(playTime),bn:R1(banner),sh:R1(shake),
    door:pick(door,['x','y','active','t','appear']),bl:blocks.map(b=>[b.tx,b.ty,R1(b.life)]),
    pl:players.map(p=>pick(p,PK)),
    en:ents.map(e=>e.enemy?Object.assign({e:1},pick(e,EK)):pick(e,['t','x','y','wp','life','phys','ground'])),
    ar:arrows.map(a=>[R1(a.x),R1(a.y),R1(a.ang||0),a.stuck?1:0,R1(a.life)]),
    fb:fireballs.map(f=>[R1(f.x),R1(f.y),f.big?1:0]),
    wv:waves.map(w=>[R1(w.x),R1(w.y),w.face,w.big?1:0,R1(w.life)]),
    sd:seeds.map(d=>[R1(d.x),R1(d.y)]),
    bm:booms.map(m=>[R1(m.x),R1(m.y),R1(m.spin),m.hs,m.owner]),
    bb:bombs.map(b=>[R1(b.x),R1(b.y),b.mini?1:0,R1(b.fuse)]),
    bo:bones.map(b=>[R1(b.x),R1(b.y),R1(b.ang)]),
    rg:rings.map(r=>[R1(r.x),R1(r.y),R1(r.r),R1(r.life)]),
    fx:fxq};
  fxq=[];
  if(gridFull||!lastGrid){s.grid=grid.map(r=>r.join(''));lastGrid=grid.map(r=>r.slice());gridFull=false;}
  else{const d=[];for(let y=0;y<LH;y++)for(let x=0;x<LW;x++)if(grid[y][x]!==lastGrid[y][x]){d.push([x,y,grid[y][x]]);lastGrid[y][x]=grid[y][x];}if(d.length)s.gd=d;}
  return s;
}
function hostBroadcast(){
  if(state==='lobby'||!grid){fxq=[];return;}
  const cs=Object.values(NET.conns).filter(c=>c.open&&c.ready);if(!cs.length){fxq=[];return;}
  const s=snapshot();let full=null;
  const str=JSON.stringify(s);
  for(const c of cs){
    if(c.needGrid){if(!full){const f=Object.assign({},s);f.grid=grid.map(r=>r.join(''));delete f.gd;full=JSON.stringify(f);}c.send(full);c.needGrid=false;}
    else c.send(str);}
}
function hostOnData(conn,raw){
  let m;try{m=typeof raw==='string'?JSON.parse(raw):raw;}catch(e){return;}
  const pl=players.find(p=>p.id===conn.peer);
  if(m.t==='in'&&pl){pl.inp=m.k;if(m.jp)pl.jp=true;if(m.ap)pl.ap=true;}
}
function hostAddGuest(conn){
  const free=COLS_FREE();
  if(!free.length){conn.send(JSON.stringify({t:'full'}));setTimeout(()=>conn.close(),300);return;}
  const r={id:conn.peer,name:'P'+(free[0]+1),col:free[0]};roster.push(r);
  NET.conns[conn.peer]=conn;conn.ready=true;conn.needGrid=true;
  if(state!=='lobby'){const pl=newPlayer(r,players.length);pl.inv=2;players.push(pl);popup(r.name+' 참가!',pl.x+6,pl.y-10,PCOLS[r.col]);}
  conn.send(JSON.stringify({t:'welcome',id:conn.peer,col:r.col,name:r.name}));
  renderLobby();
}
function hostRemoveGuest(id){
  const r=roster.find(x=>x.id===id);delete NET.conns[id];roster=roster.filter(x=>x.id!==id);
  const pl=players.find(p=>p.id===id);if(pl){players=players.filter(p=>p!==pl);popup((r?r.name:'')+' 나감',pl.x+6,pl.y-10,'#9aa0b4');}
  if(state==='play'&&players.length&&!alive().length)state='over';
  renderLobby();
}
// ---- guest ----
function guestTick(dt){
  NET.sendAcc+=dt;
  if(NET.host&&NET.host.open&&NET.sendAcc>=1/30){NET.sendAcc=0;
    if(state!=='lobby')NET.host.send(JSON.stringify({t:'in',k:{l:key.l?1:0,r:key.r?1:0,j:key.j?1:0,a:key.a?1:0,d:key.d?1:0},jp:jumpPressed,ap:atkPressed}));
    jumpPressed=atkPressed=false;}
  if(state!=='play')return;
  timer+=dt;
  for(const e of ents){if(!e.enemy)continue;
    if(e.hasKey&&Math.random()<dt*1.3)parts.push({x:e.x+Math.random()*e.w,y:e.y+Math.random()*4,vx:0,vy:-25,life:.7,col:'#fac83c'});
    if(e.charge>0&&e.ground&&Math.random()<.5)parts.push({x:e.x+e.w/2-(e.cdir||1)*7,y:e.y+e.h-2,vx:-(e.cdir||1)*rnd(10,40),vy:-rnd(10,40),life:.3,col:'#d2bea0'});}
  for(const f of fireballs)if(Math.random()<.5)parts.push({x:f.x,y:f.y,vx:0,vy:-10,life:.25,col:Math.random()<.5?'#fac83c':'#fa6c3c'});
}
function guestOnData(raw){
  let m;try{m=typeof raw==='string'?JSON.parse(raw):raw;}catch(e){return;}
  if(m.t==='welcome'){clearTimeout(netTimer);lobbyErr='';setTimeout(micRelease,3000);NET.myId=m.id;lobbyMsg='연결됐어요! 방장이 시작하길 기다리는 중… ('+m.name+')';renderLobby();return;}
  if(m.t==='full'){lobbyErr='방이 가득 찼어요 (최대 4명)';renderLobby();return;}
  if(m.t!=='s')return;
  if(m.grid){grid=m.grid.map(r=>r.split(''));}
  if(m.gd&&grid)for(const [x,y,c] of m.gd)grid[y][x]=c;
  if(!grid)return;
  const wasLobby=state==='lobby';
  state=m.st;stage=m.stg;coins=m.co;hasKey=m.hk;timer=m.tm;playTime=m.pt;banner=m.bn;if(m.sh>shake)shake=m.sh;
  door=Object.assign({x:0,y:0,w:16,h:24,active:false,t:0,appear:0},m.door);
  blocks=m.bl.map(([tx,ty,life])=>({tx,ty,life}));
  const old={};for(const p of players)old[p.id]=p;
  players=m.pl.map(p=>Object.assign(old[p.id]||{w:12,h:19},{vx:0,vy:0,ground:false,inv:0,anim:0,atk:0,swing:0,bowT:0,castT:0,weapon:null,lv:0,dead:false,hp:0},p));
  me=players.find(p=>p.id===NET.myId)||null;P=me;updAtkBtn();
  ents=m.en.map(e=>e.e?Object.assign({enemy:true,t:'enemy',vx:0,vy:0,hp:0,maxhp:1,dead:0,flash:0,ph:0,charge:0,wind:0,stun:0,aim:0,pose:0,open:0,face:1,cdir:1,k:0},e)
    :Object.assign({w:12,h:12,life:15},e));
  arrows=m.ar.map(([x,y,ang,stuck,life])=>({x,y,ang,stuck,life}));
  fireballs=m.fb.map(([x,y,big])=>({x,y,big}));
  waves=m.wv.map(([x,y,face,big,life])=>({x,y,face,big,life}));
  seeds=m.sd.map(([x,y])=>({x,y}));
  booms=m.bm.map(([x,y,spin,hs,owner])=>({x,y,spin,hs,owner}));
  bombs=m.bb.map(([x,y,mini,fuse])=>({x,y,mini,fuse}));
  bones=m.bo.map(([x,y,ang])=>({x,y,ang}));
  rings=m.rg.map(([x,y,r,life])=>({x,y,r,life}));
  for(const f of m.fx){if(f[0]==='s'){if(SFX0[f[1]])SFX0[f[1]]();}else if(f[0]==='b')burst0(f[1],f[2],f[3],f[4],f[5]);else if(f[0]==='p')popup0(f[1],f[2],f[3],f[4]);}
  if(wasLobby&&state!=='lobby'){hideLobby();if(me){camX=Math.max(0,me.x-100);camY=Math.max(0,LH*T-VH);}}
}
// ---- lobby UI ----
let lobbyMode='menu',lobbyErr='',lobbyMsg='';
const $L=()=>document.getElementById('lobbyCard');
function hideLobby(){document.getElementById('lobby').classList.add('hide');}
function showLobby(){document.getElementById('lobby').classList.remove('hide');}
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=A[Math.floor(Math.random()*A.length)];return c;}
function renderLobby(){
  const L=$L();if(!L)return;
  const err=lobbyErr?'<p class="err">'+lobbyErr+'</p>':'';
  if(lobbyMode==='menu'){
    const warn=EMBEDDED?'<p class="err">⚠ 지금은 앱 안의 미리보기 화면이라 멀티플레이 연결이 막혀 있을 수 있어요. 파일을 크롬·사파리 브라우저로 직접 열어 주세요.</p>':'';
    L.innerHTML='<h2>후드 모험가</h2><p>같은 와이파이의 친구와 최대 4명까지 함께 플레이해요</p>'+warn+err+
      '<button class="pri" id="bSolo">혼자 하기</button><button id="bHost">방 만들기</button>'+
      '<input id="iCode" maxlength="4" placeholder="코드" autocomplete="off"><button id="bJoin">참가하기</button>'+
'<p style="margin-top:12px">방 만들기·참가하기를 누르면 마이크 권한을 물어봐요. 같은 와이파이에서 기기끼리 직접 연결하는 데만 쓰고, 소리는 꺼진 상태로 녹음하지 않아요.</p>';
    document.getElementById('bSolo').onclick=startSolo;
    document.getElementById('bHost').onclick=startHost;
    document.getElementById('bJoin').onclick=()=>startGuest(document.getElementById('iCode').value);

  }else if(lobbyMode==='host'){
    const list=roster.map(r=>'<li><i style="background:'+PCOLS[r.col]+'"></i>'+r.name+(r.id===NET.myId?' (나 · 방장)':'')+'</li>').join('');
    L.innerHTML='<h2>방 만들기</h2>'+(NET.code?'<p>친구에게 이 코드를 알려주세요</p><div class="code">'+NET.code+'</div>':'<p>'+(lobbyMsg||'방을 여는 중…')+'</p>')+(NET.code&&lobbyMsg?'<p>'+lobbyMsg+'</p>':'')+err+
      '<ul>'+list+'</ul><p>'+roster.length+' / 4명</p>'+
      '<button class="pri" id="bStart"'+(NET.code?'':' disabled')+'>게임 시작</button><button id="bBack">나가기</button>';
    document.getElementById('bStart').onclick=()=>{hideLobby();reset(true);state='play';banner=2.8;MIC.timer=setTimeout(micRelease,8000);};
    document.getElementById('bBack').onclick=()=>location.reload();
  }else if(lobbyMode==='guest'){
    L.innerHTML='<h2>참가하기</h2><p>'+(lobbyMsg||'방 '+NET.code+' 에 연결하는 중…')+'</p>'+err+'<button id="bBack">나가기</button>';
    document.getElementById('bBack').onclick=()=>location.reload();
  }
}
function startSolo(){NET.mode='solo';NET.myId='me';roster=[{id:'me',name:'P1',col:0}];hideLobby();reset(true);}
function peerAvailable(){if(typeof Peer==='undefined'){lobbyErr='네트워크 라이브러리를 불러오지 못했어요';renderLobby();return false;}return true;}
async function startHost(){
  if(!peerAvailable())return;
  NET.mode='host';lobbyMode='host';lobbyErr='';lobbyMsg='마이크 권한을 허용해 주세요 (직접 연결용, 녹음 안 함)…';renderLobby();
  const mr=await micUnlock(0);if(mr!=='ok')lobbyErr=MIC_MSG[mr];
  hostPeer();}
function hostPeer(){
  const code=genCode();
  const peer=new Peer(ROOM_PREFIX+code,peerOpts());NET.peer=peer;lobbyMsg='중계 서버에 접속하는 중…';renderLobby();
  netTimeout(9000,'중계 서버(PeerJS)에 접속하지 못했어요. 인터넷 연결을 확인하거나, 앱 미리보기가 아닌 크롬·사파리 브라우저로 열어 주세요.');
  peer.on('open',id=>{clearTimeout(netTimer);NET.myId=id;NET.code=code;lobbyMsg='';roster=[{id,name:'P1',col:0}];renderLobby();});
  peer.on('connection',conn=>{
    lobbyMsg='친구가 연결을 시도하는 중…';renderLobby();if(state!=='lobby')micUnlock(20000);setTimeout(()=>watchIce(conn,'친구와'),0);
    conn.on('open',()=>{lobbyMsg='';hostAddGuest(conn);});
    conn.on('data',d=>hostOnData(conn,d));
    conn.on('close',()=>hostRemoveGuest(conn.peer));
    conn.on('error',()=>hostRemoveGuest(conn.peer));});
  peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();hostPeer();return;}
    lobbyErr='연결 오류: '+(e.type==='network'||e.type==='server-error'?'인터넷 연결을 확인해 주세요':e.type);renderLobby();});
  peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});
}
async function startGuest(code){
  code=(code||'').trim().toUpperCase();if(code.length!==4){lobbyErr='4자리 코드를 입력해 주세요';renderLobby();return;}
  if(!peerAvailable())return;
  NET.mode='guest';lobbyMode='guest';NET.code=code;lobbyErr='';lobbyMsg='마이크 권한을 허용해 주세요 (직접 연결용, 녹음 안 함)…';renderLobby();
  const mr=await micUnlock(60000);if(mr!=='ok')lobbyErr=MIC_MSG[mr];
  const peer=new Peer(peerOpts());NET.peer=peer;lobbyMsg='① 중계 서버에 접속하는 중…';renderLobby();
  netTimeout(9000,'중계 서버(PeerJS)에 접속하지 못했어요. 인터넷 연결을 확인하거나, 앱 미리보기가 아닌 크롬·사파리 브라우저로 열어 주세요.');
  peer.on('open',id=>{NET.myId=id;lobbyMsg='② 방 '+code+' 을 찾는 중…';renderLobby();
    netTimeout(20000,'방에 연결하지 못했어요. 코드가 맞는지, 방장 화면이 켜져 있는지, 모두 마이크 권한을 허용했는지 확인해 주세요. 계속 안 되면 공유기가 기기 간 통신을 막고 있을 수 있어요 — 휴대폰 핫스팟으로 모두 연결해 보세요.');
    const conn=peer.connect(ROOM_PREFIX+code,{reliable:true});NET.host=conn;setTimeout(()=>watchIce(conn,'③ 방장과'),0);
    conn.on('open',()=>{lobbyMsg='④ 연결됨! 방장 응답을 기다리는 중…';renderLobby();});
    conn.on('error',e=>{lobbyErr='연결 오류: '+(e&&e.type||e);renderLobby();});
    conn.on('data',guestOnData);
    conn.on('close',()=>{lobbyMode='guest';lobbyMsg='';lobbyErr='방장과 연결이 끊겼어요';state='lobby';showLobby();renderLobby();});});
  peer.on('error',e=>{clearTimeout(netTimer);lobbyErr=e.type==='peer-unavailable'?'방 '+code+' 을 찾을 수 없어요. 코드를 확인하고, 방장 화면이 꺼지지 않았는지 확인해 주세요.':e.type==='network'||e.type==='server-error'||e.type==='socket-error'?'중계 서버에 접속하지 못했어요. 인터넷 연결을 확인해 주세요.':'연결 오류: '+e.type;renderLobby();});
}
addEventListener('pagehide',()=>{try{NET.peer&&NET.peer.destroy();}catch(e){}});
function boot(){state='lobby';timer=0;grid=null;players=[];parts=[];popups=[];ents=[];arrows=[];fireballs=[];waves=[];seeds=[];booms=[];bombs=[];bones=[];rings=[];blocks=[];shake=0;renderLobby();requestAnimationFrame(loop);
  if(location.hash==='#solo')startSolo();}
